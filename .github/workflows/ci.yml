name: Python CI for Kivy App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 1. ติดตั้ง System Dependencies ที่ Kivy จำเป็นต้องใช้บน Linux
    - name: Install System Dependencies for Kivy
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good

    # 2. ติดตั้ง Pytest และ Kivy จาก requirements.txt
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 3. รัน Pytest พร้อมตั้งค่า Headless Mode ไม่ให้ Kivy พยายามเปิดหน้าจอ
    - name: Run Pytest
      env:
        KIVY_NO_ARGS: 1
        KIVY_NO_CONSOLELOG: 1
        KIVY_GRAPHICS: dummy
      run: |
        pytest
